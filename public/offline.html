<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline - Job Agent PH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .offline-container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
        }

        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        h1 {
            color: #2563eb;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .retry-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
        }

        .retry-button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .retry-button:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 10px;
            color: #6b7280;
            font-size: 14px;
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .offline-icon {
                font-size: 60px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <img src="/icons/icon-192x192.png" alt="Job Agent PH Logo" class="logo">

        <div class="offline-icon pulse">📡</div>

        <h1>You're Offline</h1>

        <p>
            It looks like you've lost your internet connection.
            Please check your network settings and try again.
        </p>

        <button class="retry-button" onclick="window.location.reload()">
            Try Again
        </button>

        <div class="status">
            <strong>Job Agent PH</strong><br>
            Find your dream job abroad - Connect when you're back online
        </div>
    </div>

    <script>
        // Automatically reload when connection is restored
        window.addEventListener('online', () => {
            window.location.reload();
        });

        // Check connection status
        function updateOnlineStatus() {
            const status = document.querySelector('.status');
            if (navigator.onLine) {
                status.innerHTML = '<strong style="color: #10b981;">✓ Connection Restored!</strong><br>Reloading...';
                setTimeout(() => window.location.reload(), 1000);
            }
        }

        // Check every 5 seconds
        setInterval(updateOnlineStatus, 5000);
    </script>
</body>
</html>
