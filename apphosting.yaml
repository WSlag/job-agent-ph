# Firebase App Hosting Configuration
# This file defines environment variables and runtime configuration for your Next.js app

# Runtime configuration
runConfig:
  minInstances: 0  # Scale to zero when idle (free tier friendly)
  maxInstances: 10  # Maximum concurrent instances
  cpu: 1  # CPU allocation
  memoryMiB: 512  # Memory allocation (512MB)

# Environment variables
env:
  # Firebase Client Configuration (Public - Safe for client-side)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDv8O0G7bLxquHRCZj9Y8XpWxgldJbAD24

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: jobs-agency-8f28b.firebaseapp.com

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: jobs-agency-8f28b

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: jobs-agency-8f28b.firebasestorage.app

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "926738060539"

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:926738060539:web:b6534d906922dde2a2cc5e

  # reCAPTCHA Enterprise Site Key for App Check (Public - Safe for client-side)
  - variable: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY
    value: 6LeAcFAsAAAAAFBN-Hil6nHdVaXaioFNd8-hGku7

  # Admin Secret Key (Server-side only - Private)
  # WARNING: Must NOT have NEXT_PUBLIC_ prefix to keep it server-side only
  # Set the real value via Firebase App Hosting secret env vars, not in this file.
  - variable: ADMIN_SECRET_KEY
    value: YOUR_ADMIN_SECRET_KEY

  # App URL (Production)
  - variable: NEXT_PUBLIC_APP_URL
    value: https://www.jobagentph.com

  # Firebase Admin Configuration (Server-side only - Private)
  - variable: FIREBASE_PROJECT_ID
    value: jobs-agency-8f28b

  - variable: FIREBASE_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@jobs-agency-8f28b.iam.gserviceaccount.com

  # Firebase Private Key (Server-side only - Private)
  # Note: The \n characters represent line breaks in the private key
  # Set the real value via Firebase App Hosting secret env vars, not in this file.
  - variable: FIREBASE_PRIVATE_KEY
    value: "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY_HERE\n-----END PRIVATE KEY-----\n"

  # Resend Email Configuration (Server-side only - Private)
  # Set the real value via Firebase App Hosting secret env vars, not in this file.
  - variable: RESEND_API_KEY
    value: YOUR_RESEND_API_KEY

  - variable: EMAIL_FROM
    value: contact@jobagentph.com

  - variable: RESEND_INBOUND_EMAIL
    value: outreach@lekiraepri.resend.app